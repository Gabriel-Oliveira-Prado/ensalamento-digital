      responses:
        '204':
          description: No response body
  /api/ensalamento/alocacoes/{id}/trocar/:
    post:
      operationId: ensalamento_alocacoes_trocar_create
      description: Altera a sala e/ou o horário, valida conflitos e registra o motivo
        no histórico.
      summary: Troca sala e/ou horário de uma alocação
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Alocações
      requestBody:
