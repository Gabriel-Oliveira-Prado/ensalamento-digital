          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TrocaAlocacao'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Alocação atualizada e histórico registrado.
        '400':
          description: Dados inválidos ou conflito de ensalamento.
        '404':
          description: Alocação não encontrada.
