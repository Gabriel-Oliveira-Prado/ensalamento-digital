components:
  schemas:
    Alocacao:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        horario:
          type: integer
        professor:
          type: integer
        sala:
          type: integer
        turma:
          type: integer
        disciplina:
          type: integer
        coordenador:
          type: integer
        aviso_capacidade:
          type: string
          nullable: true
          readOnly: true
      required:
      - aviso_capacidade
      - coordenador
      - disciplina
      - horario
      - id
      - professor
      - sala
      - turma
    Disciplina:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nome:
          type: string
          maxLength: 150
      required:
      - id
      - nome
    Historico:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        data_alteracao:
          type: string
          format: date-time
          readOnly: true
        motivo:
          type: string
          readOnly: true
        alocacao:
          type: integer
          readOnly: true
        solicitacao_troca:
          type: integer
          readOnly: true
          nullable: true
        sala:
          type: string
          readOnly: true
        disciplina:
          type: string
          readOnly: true
      required:
      - alocacao
      - data_alteracao
      - disciplina
      - id
      - motivo
      - sala
      - solicitacao_troca
    Horario:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        dia:
          type: string
          format: date
        hora_inicio:
          type: string
          format: time
        hora_fim:
          type: string
          format: time
      required:
      - dia
      - hora_fim
      - hora_inicio
      - id
    NecessitaDe:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        disciplina:
          type: integer
        recurso:
          type: integer
      required:
      - disciplina
      - id
      - recurso
    Painel:
      type: object
      properties:
        data:
          type: string
          format: date
        atualizado_em:
          type: string
          format: date-time
        aulas:
          type: array
          items:
            $ref: '#/components/schemas/PainelAula'
      required:
      - atualizado_em
      - aulas
      - data
    PainelAula:
      type: object
      properties:
        id:
          type: integer
        hora_inicio:
          type: string
        hora_fim:
          type: string
        sala:
          type: string
        disciplina:
          type: string
        professor:
          type: string
        turma:
          type: string
        situacao:
          $ref: '#/components/schemas/SituacaoEnum'
      required:
      - disciplina
      - hora_fim
      - hora_inicio
      - id
      - professor
      - sala
      - situacao
      - turma
    PatchedAlocacao:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        horario:
          type: integer
        professor:
          type: integer
        sala:
          type: integer
        turma:
          type: integer
        disciplina:
          type: integer
        coordenador:
          type: integer
        aviso_capacidade:
          type: string
          nullable: true
          readOnly: true
    PatchedDisciplina:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nome:
          type: string
          maxLength: 150
    PatchedHorario:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        dia:
          type: string
          format: date
        hora_inicio:
          type: string
          format: time
        hora_fim:
          type: string
          format: time
    PatchedRecurso:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nome:
          type: string
          maxLength: 100
    PatchedSala:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nome:
          type: string
          maxLength: 100
        capacidade:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        tipo:
          type: string
          maxLength: 100
    PatchedSemestre:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        ano:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        periodo:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        data_inicio:
          type: string
          format: date
        data_fim:
          type: string
          format: date
    PatchedTurma:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        qtd_aluno:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        semestre:
          type: integer
    PatchedUsuario:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          writeOnly: true
        first_name:
          type: string
          title: Primeiro nome
          maxLength: 150
        last_name:
          type: string
          title: Último nome
          maxLength: 150
        tipo:
          $ref: '#/components/schemas/TipoEnum'
    Possui:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        sala:
          type: integer
        recurso:
          type: integer
      required:
      - id
      - recurso
      - sala
    Recurso:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nome:
          type: string
          maxLength: 100
      required:
      - id
      - nome
    Sala:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nome:
          type: string
          maxLength: 100
        capacidade:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        tipo:
          type: string
          maxLength: 100
      required:
      - capacidade
      - id
      - nome
      - tipo
    Semestre:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        ano:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        periodo:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        data_inicio:
          type: string
          format: date
        data_fim:
          type: string
          format: date
      required:
      - ano
      - data_fim
      - data_inicio
      - id
      - periodo
    SituacaoEnum:
      enum:
      - agendada
      - encerrada
      - em_andamento
      - proxima
      type: string
      description: |-
        * `agendada` - agendada
        * `encerrada` - encerrada
        * `em_andamento` - em_andamento
        * `proxima` - proxima
    TipoEnum:
      enum:
      - PROFESSOR
      - COORDENADOR
      - ADMINISTRADOR
      type: string
      description: |-
        * `PROFESSOR` - Professor
        * `COORDENADOR` - Coordenador
        * `ADMINISTRADOR` - Administrador
    TokenObtainPair:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - email
      - password
      - refresh
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
    TrocaAlocacao:
      type: object
      properties:
        sala:
          type: integer
        horario:
          type: integer
        motivo:
          type: string
          maxLength: 255
      required:
      - motivo
    Turma:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        qtd_aluno:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        semestre:
          type: integer
      required:
      - id
      - qtd_aluno
      - semestre
    Usuario:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          writeOnly: true
        first_name:
          type: string
          title: Primeiro nome
          maxLength: 150
        last_name:
          type: string
          title: Último nome
          maxLength: 150
        tipo:
          $ref: '#/components/schemas/TipoEnum'
      required:
      - email
      - id
      - tipo
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
